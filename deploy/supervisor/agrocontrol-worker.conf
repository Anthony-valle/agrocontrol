[program:agrocontrol-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/agrocontrol/artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/agrocontrol
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/agrocontrol/storage/logs/worker.log
stopwaitsecs=180
